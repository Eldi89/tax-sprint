<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tax Sprint</title>
<meta name="description" content="A sixteen-day study plan for a tax interview: lessons, flashcards, quizzes, calculation cases and mock interview questions.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17222a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tax Sprint">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one column, like a tax form. Ink "Part" bars head each block, square checkboxes mark steps, tabs sit at the bottom. */
  --paper:#eef2f1; --surface:#ffffff; --ink:#13212b; --muted:#566673; --line:#c4cfd3; --tint:#dfeaf1;
  --accent:#1b4f8f; --on-accent:#ffffff;
  --good:#17714b; --good-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fbe4e1; --warn:#8a5200; --warn-bg:#fbeed6;
  --display:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e161c; --surface:#17222a; --ink:#e4ecf0; --muted:#94a5b1; --line:#2f404b; --tint:#1c2c38;
    --accent:#86b6ee; --on-accent:#0b1620;
    --good:#62d19c; --good-bg:#12362a; --bad:#ff8f85; --bad-bg:#40201d; --warn:#f1b55c; --warn-bg:#3a2c12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e161c; --surface:#17222a; --ink:#e4ecf0; --muted:#94a5b1; --line:#2f404b; --tint:#1c2c38;
  --accent:#86b6ee; --on-accent:#0b1620;
  --good:#62d19c; --good-bg:#12362a; --bad:#ff8f85; --bad-bg:#40201d; --warn:#f1b55c; --warn-bg:#3a2c12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.ver{font-size:12px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.urgent{background:var(--warn-bg);color:var(--warn);border-color:transparent}

/* main */
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
main:focus{outline:none}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs a{display:block;text-align:center;padding:12px 4px 13px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-top:3px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
body.in-session .tabs{display:none}

/* blocks */
.box{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.part{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);padding:6px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px 3px 0 0}
.part span:last-child{font-weight:500;letter-spacing:.03em}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 180px;min-width:0}

/* hero */
.hero{display:flex;align-items:center;gap:16px}
.hero .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.hero h1{font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns > *{flex:1 1 120px}

/* steps */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.chk{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:2px;background:var(--surface);padding:0;position:relative}
.chk[aria-pressed="true"]{background:var(--ink)}
.chk[aria-pressed="true"]::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg)}
.steps .lab{flex:1 1 auto;min-width:0}
.steps .lab b{display:block;font-weight:600}
.steps .lab span{font-size:13px;color:var(--muted)}
.steps li.done .lab b{text-decoration:line-through;text-decoration-color:var(--muted)}

/* schedule */
.sched{list-style:none;margin:0;padding:0}
.sched li{border-top:1px solid var(--line)}
.sched li:first-child{border-top:0}
.sched button{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px}
.sched .dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sched .tt{font-size:15px}
.sched li.sel button{background:var(--tint)}
.chip{font-size:12px;font-weight:600;border-radius:3px;padding:2px 7px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.now{background:var(--accent);color:var(--on-accent);border-color:transparent}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--ink);border-radius:2px;padding:1px 6px;white-space:nowrap}

/* lists of modes and topics */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.list .lab{flex:1 1 200px;min-width:0}
.list .lab b{display:block}
.list .lab span{font-size:14px;color:var(--muted)}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.topic .nm{font-weight:600}
.topic .pc{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.topic .meter{grid-column:1 / -1}
.plain{list-style:none;margin:0;padding:0}
.plain li{border-top:1px solid var(--line)}
.plain li:first-child{border-top:0}
.meter{height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.thin{height:4px}
.meter.alt i{background:var(--good)}

label.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
select,input[type="text"],textarea{background:var(--surface);border:1px solid var(--muted);border-radius:4px;padding:10px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}

/* lesson */
.lesson h1{font-size:28px}
.lesson .intro{font-size:18px;max-width:62ch}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;max-width:65ch}
.points li{padding-left:18px;position:relative}
.points li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--accent)}
.callout{background:var(--tint);border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 4px 4px 0}
.callout .k{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
details.term{border-top:1px solid var(--line)}
details.term:first-of-type{border-top:0}
details.term summary{padding:11px 14px;font-weight:600;cursor:pointer}
details.term p{padding:0 14px 12px;max-width:65ch}

/* session */
.sbar{display:flex;align-items:center;gap:12px}
.sbar .ttl{flex:1 1 auto;min-width:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.sbar .cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.x{background:none;border:1px solid var(--line);border-radius:4px;min-height:40px;padding:4px 12px;font-weight:600}
.prompt{font-size:20px;font-weight:600;line-height:1.35;max-width:60ch;text-wrap:pretty}
.card{display:flex;flex-direction:column;justify-content:center;gap:14px;width:100%;min-height:230px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 18px}
.card .front{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15}
.card .back{font-size:17px;border-top:1px solid var(--line);padding-top:14px}
.card .hint{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:48px}
.opt .ltr{width:26px;height:26px;border:2px solid var(--ink);border-radius:2px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;text-transform:uppercase}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .ltr{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default;color:inherit;opacity:1}
.fb{border-radius:4px;padding:12px 14px;border-left:4px solid var(--line);background:var(--surface)}
.fb.good{background:var(--good-bg);border-left-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.score{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.miss{border-top:1px solid var(--line);padding:12px 14px}
.miss:first-child{border-top:0}
.miss .q{font-weight:600}
.miss .a{color:var(--good);font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term-chip{border:1px solid var(--ink);background:var(--surface);border-radius:3px;padding:8px 10px;font-weight:600;min-height:40px;text-align:left}
.term-chip.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.term-chip.done,.def.done{opacity:.4;text-decoration:line-through}
.def{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px}
.def.flash{background:var(--bad-bg);border-color:var(--bad)}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:slot}
.slots li{counter-increment:slot}
.piece{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px}
.slots .piece::before{content:counter(slot);font-family:var(--display);font-weight:700;width:26px;height:26px;border:2px solid var(--ink);border-radius:2px;display:grid;place-items:center;font-size:14px}
.pool .piece{grid-template-columns:1fr;border-style:dashed}
.piece.right{background:var(--good-bg);border-color:var(--good)}
.piece.wrong{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;min-width:74px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start}
.checks input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.pre{white-space:pre-wrap}

/* progress */
.areas{width:100%;border-collapse:collapse}
.areas td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.areas tr:first-child td{border-top:0}
.areas .pc{text-align:right;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.areas .bars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.strip i{display:block;aspect-ratio:1;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.strip i.h1{background:var(--tint)}
.strip i.h2{background:var(--accent);opacity:.55;border-color:transparent}
.strip i.h3{background:var(--accent);border-color:transparent}
.strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--accent)}
.legend i.alt{background:var(--good)}

@media (max-width:400px){
  .hero .big{font-size:54px}
  .sched button{grid-template-columns:76px 1fr auto}
  .card .front{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){
  .meter i{transition:width .25s ease}
}
.card .tag{align-self:flex-start}

/* iPhone Home Screen: keep clear of the notch and the home indicator (zero elsewhere) */
.top{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
body.in-session .wrap{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
textarea.short{min-height:76px;font-size:13px;word-break:break-all}

</style>
</head>
<body>
<header class="top">
  <div><span class="wordmark">Tax Sprint</span><span class="ver" id="ver"></span></div>
  <span class="pill" id="left"></span>
</header>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <a href="#today">Today</a>
  <a href="#practice">Practice</a>
  <a href="#topics">Topics</a>
  <a href="#progress">Progress</a>
</nav>
<script>
/* Tax Sprint content, part 1: areas, plan, lessons, flashcards. Federal rules, tax year 2026 unless noted. */
const AREAS=[
{id:"ind",name:"Individual returns",tag:"Form 1040"},
{id:"pship",name:"Partnerships",tag:"Form 1065"},
{id:"scorp",name:"S corporations",tag:"Form 1120-S"},
{id:"ccorp",name:"C corporations",tag:"Form 1120"},
{id:"depr",name:"Depreciation and methods",tag:"Forms 4562, 3115"},
{id:"prov",name:"Tax provision",tag:"ASC 740"},
{id:"intl",name:"International",tag:"Form 5472"},
{id:"pay",name:"Payroll and 1099s",tag:"Forms 941, 1099"},
{id:"proc",name:"Procedure and ethics",tag:"Circular 230"},
{id:"state",name:"State and local",tag:"SALT"},
{id:"law",name:"2026 law and numbers",tag:"OBBBA"}
];

const PLAN=[
{d:"2026-11-20",t:"Individual returns: how the 1040 flows",a:"ind",s:["read","cards","quiz","talk"]},
{d:"2026-11-21",t:"Individual returns: losses, gains and credits",a:"ind",s:["cards","quiz","tf","due"]},
{d:"2026-11-22",t:"Partnerships: basis, K-1 and capital accounts",a:"pship",s:["read","cards","quiz","talk"]},
{d:"2026-11-23",t:"Partnerships: allocations, sales and audits",a:"pship",s:["cards","quiz","match","due"]},
{d:"2026-11-24",t:"S corporations",a:"scorp",s:["read","cards","quiz","talk","due"]},
{d:"2026-11-25",t:"C corporations and the M-1",a:"ccorp",s:["read","cards","quiz","talk","due"]},
{d:"2026-11-26",t:"Thanksgiving: light review",a:"all",s:["due","weak"]},
{d:"2026-11-27",t:"Depreciation and accounting methods",a:"depr",s:["read","cards","quiz","talk","due"]},
{d:"2026-11-28",t:"Tax provision (ASC 740)",a:"prov",s:["read","cards","quiz","talk","due"]},
{d:"2026-11-29",t:"International: US subsidiaries of foreign parents",a:"intl",s:["read","cards","quiz","talk","due"]},
{d:"2026-11-30",t:"Payroll and information returns",a:"pay",s:["read","cards","quiz","due"]},
{d:"2026-12-01",t:"Procedure, penalties and ethics",a:"proc",s:["read","cards","quiz","talk","due"]},
{d:"2026-12-02",t:"State and local tax",a:"state",s:["read","cards","quiz","talk","due"]},
{d:"2026-12-03",t:"2026 law changes and key numbers",a:"law",s:["read","cards","quiz","talk","due"]},
{d:"2026-12-04",t:"Calculations and weak spots",a:"all",s:["cases","order","weak","due"]},
{d:"2026-12-05",t:"Dress rehearsal",a:"all",s:["exam","talk","due"]},
{d:"2026-12-06",t:"Deadline day: warm up only",a:"all",s:["due","talk"]}
];

const LESSONS={
ind:{intro:"The 1040 is a funnel. Know the order of the steps and you can place any item an interviewer throws at you.",
points:[
"Flow: gross income minus adjustments equals AGI. Minus the standard or itemized deduction and the QBI deduction equals taxable income. Then tax, minus credits, plus other taxes (SE tax, NIIT), minus payments, gives the refund or balance due.",
"AGI is the hinge. Medical expenses, many credits, IRA deductions and the rental loss allowance phase in or out based on AGI or a modified version of it (MAGI).",
"Filing status is fixed on December 31 and drives brackets, the standard deduction and credits. Head of household needs an unmarried taxpayer, a qualifying person and more than half the household costs.",
"Losses pass four gates in order: basis, at-risk, passive activity, excess business loss. Whatever fails a gate carries forward under that gate's rule.",
"Capital gains: more than one year is long term (0, 15 or 20 percent). Net capital losses offset only $3,000 of ordinary income a year; the rest carries forward.",
"A deduction lowers taxable income. A credit lowers tax dollar for dollar, and a refundable credit can pay out beyond the tax owed.",
"Estimated tax safe harbor: pay 90 percent of this year's tax or 100 percent of last year's (110 percent if last year's AGI was over $150,000)."],
say:"I tie every document to the organizer and the prior year, check carryforwards and estimates, and only then look at planning points."},
pship:{intro:"Partnership tax is basis tracking. Most interview questions here reduce to one thing: what is the partner's outside basis, and what changed it?",
points:[
"A partnership files Form 1065 but pays no income tax. Income, deductions and credits flow to partners on Schedule K-1 and keep their character.",
"Outside basis = contributions + share of income (including tax-exempt income) + increases in share of liabilities, minus distributions, losses, nondeductible expenses and decreases in share of liabilities. It can't go below zero.",
"Debt counts. Under §752 an increase in a partner's share of partnership liabilities is treated as a cash contribution. A decrease is treated as a cash distribution.",
"Capital account is not basis. The K-1 reports capital on the tax basis method, which leaves out the partner's share of liabilities. That is why capital can be negative while basis is positive.",
"Allocations follow the partnership agreement if they have substantial economic effect (§704(b)). Built-in gain on contributed property goes back to the contributor (§704(c)).",
"Guaranteed payments are fixed payments to a partner for services or capital. The partnership deducts them; the partner reports ordinary income, usually subject to SE tax. They go on the K-1, never on a W-2.",
"Cash distributed above outside basis is gain. Selling an interest gives capital gain except for hot assets (§751), which produce ordinary income. A §754 election lets the buyer step up inside basis.",
"Audits run under the BBA centralized regime: one partnership representative binds everyone, and the partnership corrects a return with an AAR instead of an amended 1065."],
say:"Before I conclude on any K-1 loss, I ask for the basis schedule and the partner's participation facts."},
scorp:{intro:"An S corporation is a corporation that elected pass-through treatment. The price of avoiding SE tax on profits is a set of strict eligibility and basis rules.",
points:[
"Eligibility: domestic corporation, no more than 100 shareholders, only US individuals, estates and certain trusts as owners, and one class of stock. Voting differences are allowed.",
"Election: Form 2553, due by the 15th day of the third month of the year it should take effect (March 15 for a calendar year). Late relief exists under Rev. Proc. 2013-30.",
"Every item is allocated pro rata, per share per day. There are no special allocations.",
"Shareholder-employees must take reasonable W-2 compensation before distributions. Zero salary with large distributions is a classic audit target.",
"Basis comes from stock and from loans the shareholder makes directly to the corporation. Bank debt of the corporation gives no basis, even if the shareholder guarantees it. Track it on Form 7203.",
"Yearly basis order: add income, subtract distributions, subtract nondeductible expenses, then subtract losses. Losses beyond stock and debt basis are suspended.",
"Former C corporations watch three things: AAA for distribution ordering, the built-in gains tax for 5 years after conversion, and the passive income tax while old E&P remains.",
"Health insurance for a more-than-2% shareholder goes in W-2 Box 1 (no FICA) and the shareholder deducts it above the line."],
say:"For every S corp client I check three things first: reasonable compensation, shareholder basis, and whether distributions were pro rata."},
ccorp:{intro:"The 1120 is a reconciliation exercise. You start with book income and explain every difference until you reach taxable income.",
points:[
"A C corporation is its own taxpayer at a flat 21 percent. Profits are taxed again when paid out as dividends, which the corporation can't deduct.",
"Schedule M-1 reconciles book income to taxable income. Corporations with total assets of $10 million or more use Schedule M-3. Schedule L is the balance sheet; M-2 rolls retained earnings.",
"Typical add-backs: federal income tax expense, 50 percent of meals, entertainment, fines and penalties, accruals not yet deductible. Typical subtractions: excess tax depreciation and tax-exempt interest.",
"NOLs generated after 2017 carry forward indefinitely, can't be carried back, and offset at most 80 percent of taxable income.",
"Dividends received deduction: 50 percent (under 20% ownership), 65 percent (20% up to 80%), 100 percent (80% or more, same affiliated group).",
"Charitable contributions are capped at 10 percent of taxable income. Starting in 2026 only the amount above a 1 percent floor is deductible.",
"Business interest (§163(j)) is limited to 30 percent of adjusted taxable income unless the company passes the small business gross receipts test ($32 million for 2026).",
"Distributions are dividends to the extent of earnings and profits (E&P), then a return of capital that reduces stock basis, then capital gain."],
say:"I map the trial balance to the return, build the M-1 line by line, and make sure Schedule L and M-2 tie to the financial statements before anything else."},
depr:{intro:"Cost recovery questions test two things: which method gets the fastest deduction, and what happens when the asset is sold.",
points:[
"MACRS lives: 5 years for computers and vehicles, 7 for furniture and most equipment, 15 for land improvements and qualified improvement property, 27.5 for residential rental, 39 for nonresidential buildings. Land is never depreciated.",
"Conventions: half-year for personal property, mid-quarter if more than 40 percent is placed in service in the last quarter, mid-month for real property.",
"§179 is an election with a dollar cap ($2,560,000 for 2026) and it can't create a loss. Bonus depreciation applies unless you elect out, has no cap, can create a loss, and is 100 percent for property acquired after January 19, 2025.",
"On sale, §1245 turns gain into ordinary income up to the depreciation taken on personal property. Depreciation on real property is taxed to individuals at up to 25 percent (unrecaptured §1250 gain). Remaining gain on business assets held over a year is §1231 gain.",
"Repairs or improvements: capitalize a betterment, adaptation or restoration. The de minimis safe harbor lets you expense items up to $2,500 ($5,000 with audited financial statements).",
"Accounting methods: the cash method is open to businesses under the gross receipts test. Changing a method takes Form 3115 and a §481(a) catch-up adjustment; an increase to income is generally spread over four years.",
"Accrual deductions need the all-events test and economic performance. Bonuses accrued to unrelated employees must be paid within 2½ months of year end. Amounts owed to related cash-basis parties wait until paid (§267).",
"Intangibles bought in an acquisition (§197) amortize over 15 years. Start-up costs: up to $5,000 expensed, the rest over 180 months."],
say:"I keep separate federal and state depreciation schedules, because many states do not follow bonus depreciation."},
prov:{intro:"The provision answers one question: what is the total income tax expense on the financial statements, and why does it differ from 21 percent?",
points:[
"Total tax expense = current tax + deferred tax. Current is what the return will show for the year. Deferred is the change in deferred tax assets and liabilities.",
"Permanent differences never reverse (fines, half of meals, tax-exempt interest). They change the effective tax rate and create no deferred tax.",
"Temporary differences reverse over time. A future deduction creates a deferred tax asset (accrued expenses, reserves, NOLs). Future taxable income creates a deferred tax liability (faster tax depreciation).",
"Deferred tax = temporary difference × the enacted rate expected when it reverses. A rate change is booked in the period the law is enacted.",
"A valuation allowance reduces a deferred tax asset when it is more likely than not (over 50 percent) that it won't be realized. Cumulative losses in recent years are strong negative evidence.",
"Uncertain tax positions (ASC 740-10) take two steps: recognize only if more likely than not to be sustained on the merits, then measure the largest amount that is more than 50 percent likely to be realized.",
"The rate reconciliation bridges the 21 percent statutory rate to the effective rate: state taxes, permanent items, credits, valuation allowance changes, return-to-provision true-ups."],
say:"I can explain the effective tax rate to an auditor or to a foreign parent by walking the rate reconciliation line by line."},
intl:{intro:"For US subsidiaries of foreign parents, interviewers look for three things: Form 5472, withholding on payments to the parent, and transfer pricing support.",
points:[
"Inbound means foreign persons investing in the US. Outbound means US persons investing abroad. A US subsidiary of a foreign parent is inbound.",
"Form 5472: filed with Form 1120 by a US corporation that is at least 25 percent foreign owned, one form per foreign related party with reportable transactions (sales, purchases, fees, royalties, interest, loans). Penalty: $25,000 per form.",
"A foreign-owned single-member LLC is disregarded for income tax but still files a pro forma Form 1120 with Form 5472.",
"Transfer pricing (§482): related party prices must be arm's length. Intercompany agreements and a transfer pricing study defend the position.",
"US-source interest, dividends, royalties and similar FDAP income paid to a foreign person face 30 percent withholding on the gross amount unless a treaty reduces it. The foreign payee gives Form W-8BEN-E; the payer files Forms 1042 and 1042-S by March 15.",
"Effectively connected income (ECI) of a foreign person is taxed on a net basis at regular rates. A treaty usually requires a permanent establishment before the US can tax business profits.",
"Outbound vocabulary: CFC, Subpart F, NCTI (formerly GILTI), FDDEI (formerly FDII), foreign tax credit, Form 5471.",
"Individuals: residency by green card or substantial presence test, FBAR for foreign accounts over $10,000 in total, Form 8938 for specified foreign financial assets."],
say:"On an inbound client I start with the ownership chart, list every intercompany flow, and check each one for 5472 reporting, withholding and pricing support."},
pay:{intro:"Payroll is a compliance calendar with harsh penalties. Know the taxes, the forms and who is personally on the hook.",
points:[
"FICA: 6.2 percent Social Security on wages up to $184,500 (2026) plus 1.45 percent Medicare on all wages, from both employee and employer. Employees also pay 0.9 percent Additional Medicare on wages over $200,000, with no employer match.",
"FUTA: employer only, 6.0 percent on the first $7,000 per employee, usually 0.6 percent after the state unemployment credit.",
"Forms: 941 quarterly, 940 annually, W-2 and W-3 by January 31. Deposits are monthly or semiweekly based on a lookback period; $100,000 of liability in one day is due the next business day.",
"Withheld income tax and employee FICA are trust fund taxes. A responsible person who willfully fails to pay them is personally liable for 100 percent (trust fund recovery penalty, §6672).",
"Employee or contractor: look at behavioral control, financial control and the relationship. Misclassification brings back taxes and penalties.",
"Form 1099-NEC goes to contractors paid $2,000 or more for payments made in 2026 (it was $600), due January 31. Collect Form W-9 first; without a TIN, backup withhold at 24 percent.",
"Self-employed people pay both halves: 15.3 percent on 92.35 percent of net earnings, and deduct half of it above the line."],
say:"Every year end I reconcile the four 941s to the W-3 and to the wage accounts in the general ledger."},
proc:{intro:"Procedure questions show whether you can protect the client and the firm when something goes wrong.",
points:[
"Statute of limitations to assess: 3 years from filing, 6 years if more than 25 percent of gross income is omitted, no limit for fraud or an unfiled return. Refund claims: the later of 3 years from filing or 2 years from payment.",
"An extension (Form 4868 for individuals, Form 7004 for businesses) extends the time to file, never the time to pay.",
"Penalties: failure to file 5 percent a month up to 25 percent; failure to pay 0.5 percent a month up to 25 percent; accuracy-related 20 percent; civil fraud 75 percent.",
"Relief: first-time abatement for a clean 3-year history, or reasonable cause supported by facts and documents.",
"Notices: a CP2000 proposes changes from document matching and is not an audit. A 30-day letter offers Appeals. A 90-day letter (notice of deficiency) starts the clock to petition the Tax Court.",
"Form 2848 lets you represent the client. Form 8821 only lets you receive information.",
"Circular 230 sets the duties of practitioners: due diligence, competence, no unreasonable positions, prompt return of client records. §7216 forbids using or disclosing return information without consent.",
"Preparer standard (§6694): substantial authority for an undisclosed position; reasonable basis if disclosed on Form 8275."],
say:"When a notice arrives I read exactly which item the IRS questions, pull the workpapers, and answer before the deadline with documents."},
state:{intro:"State questions start with nexus: does the state have the right to tax this client at all? Everything else follows from that.",
points:[
"Nexus is the connection that lets a state tax a business. It can be physical (employees, property, inventory) or economic (sales above a threshold).",
"Wayfair (2018) allowed states to require sales tax collection from remote sellers based on economic nexus alone.",
"P.L. 86-272 blocks state net income tax when the only in-state activity is soliciting orders for tangible goods. It doesn't cover services or sales tax.",
"Multistate income is apportioned by formula. Most states use a single sales factor and source services to the customer's market state.",
"States choose their own conformity. Common adjustments: bonus depreciation addbacks, interest limits, NOL rules. Keep a state depreciation schedule.",
"PTET: a pass-through entity elects to pay state income tax itself, deducts it federally outside the owners' SALT cap, and the owners take a state credit.",
"Individuals: domicile is the permanent home. Statutory residency in New York means a permanent place of abode plus more than 183 days in the state. Residents get a credit for tax paid to other states.",
"New York City doesn't recognize S corporations (they pay the general corporation tax), and partnerships and sole proprietors doing business in the City pay the unincorporated business tax."],
say:"Each year I rerun the nexus checklist: where are the employees, the property, the customers and the sales totals by state?"},
law:{intro:"Interviewers ask about the 2025 tax law (the One Big Beautiful Bill Act, OBBBA) to see if you are current. Know the headline changes and a few 2026 numbers.",
points:[
"Made permanent: the TCJA individual rates, the larger standard deduction ($16,100 single, $32,200 joint, $24,150 head of household for 2026), the 20 percent QBI deduction, and 100 percent bonus depreciation for property acquired after January 19, 2025.",
"Temporary deductions for 2025 to 2028: qualified tips (up to $25,000), the premium part of overtime (up to $12,500, or $25,000 joint), interest on loans for new US-assembled cars (up to $10,000), and $6,000 per person age 65 or older.",
"SALT cap: $40,400 for 2026, reduced for income above about $505,000, and back to $10,000 in 2030.",
"Business: §179 limit $2,560,000; domestic research costs deductible again (§174A); the interest limit computed before depreciation and amortization again; 1099-NEC and 1099-MISC threshold $2,000 from 2026.",
"Family and estate: child tax credit $2,200; estate and gift exclusion $15 million per person; annual gift exclusion $19,000.",
"New from 2026: a charitable deduction for non-itemizers ($1,000, or $2,000 joint), a 0.5 percent of AGI floor on itemized charity, and itemized deductions worth at most 35 cents per dollar for top-bracket taxpayers.",
"International renames for years after 2025: GILTI becomes NCTI and FDII becomes FDDEI."],
say:"For each client I list which 2025 law changes apply, so the 2026 projections and estimates already reflect them."}
};

/* [area, front, back] Append new cards at the end so saved progress keeps pointing at the right card. */
const CARDS=[
["ind","AGI (adjusted gross income)","Gross income minus above-the-line adjustments such as half of SE tax, HSA and traditional IRA contributions, and SE health insurance. Many limits and phaseouts are based on it."],
["ind","MAGI","AGI with certain items added back. The add-backs differ by provision, so always ask: MAGI for which rule?"],
["ind","Refundable vs nonrefundable credit","A refundable credit can pay out more than the tax owed (EITC, part of the child tax credit). A nonrefundable credit only brings tax down to zero."],
["ind","Head of household","Unmarried at year end, paid more than half the cost of keeping up a home, and a qualifying person lived there more than half the year."],
["ind","Qualifying child tests","Relationship, age, residency (more than half the year), support (the child didn't provide over half of their own) and no joint return."],
["ind","Order of loss limitations","Basis, then at-risk (§465), then passive activity (§469), then excess business loss (§461(l))."],
["ind","Material participation","Regular, continuous and substantial involvement in a business. The most common test is more than 500 hours in the year. Without it the activity is passive."],
["ind","Passive activity loss rule (§469)","Passive losses offset only passive income. The unused part is suspended and released when there is passive income or the activity is fully sold."],
["ind","$25,000 rental allowance","An owner who actively participates in rental real estate can deduct up to $25,000 of loss against other income. It phases out between MAGI of $100,000 and $150,000."],
["ind","Real estate professional","More than 750 hours and more than half of working time in real property businesses, with material participation. Their rental losses are not automatically passive."],
["ind","Wash sale","A loss is disallowed if substantially identical stock is bought within 30 days before or after the sale. The loss is added to the basis of the new shares."],
["ind","§121 home sale exclusion","Exclude up to $250,000 of gain ($500,000 joint) on a main home owned and used for 2 of the last 5 years."],
["ind","§1031 like-kind exchange","Defers gain on swapping real property held for business or investment. Identify replacement property in 45 days, close in 180. Cash or other boot received is taxable."],
["ind","Net investment income tax (NIIT)","3.8 percent on investment income when MAGI exceeds $200,000 single or $250,000 joint. The thresholds are not indexed."],
["ind","Estimated tax safe harbor","No underpayment penalty if you paid 90 percent of this year's tax or 100 percent of last year's (110 percent if prior-year AGI was above $150,000)."],
["ind","Capital loss limitation","Net capital losses offset only $3,000 of ordinary income per year ($1,500 married filing separately). The excess carries forward with no expiration."],
["ind","Stepped-up vs carryover basis","Inherited property takes fair market value at death (step-up) and is always long term. Gifted property keeps the donor's basis (carryover)."],
["ind","Alternative minimum tax (AMT)","A parallel tax computation that adds back certain preferences, such as state taxes and incentive stock option spreads. You pay whichever is higher: regular tax or tentative minimum tax."],

["pship","Flow-through and Schedule K-1","The partnership pays no income tax. Each partner reports their share of every item, which keeps its character (ordinary, capital, tax-exempt)."],
["pship","Outside basis","A partner's basis in the partnership interest. Contributions plus share of income and liabilities, minus distributions and losses. Losses are deductible only up to this amount."],
["pship","Inside basis","The partnership's own basis in its assets. It can differ from the partners' outside basis after an interest is sold or a distribution is made."],
["pship","Capital account vs outside basis","Tax basis capital leaves out the partner's share of partnership liabilities; outside basis includes it. Roughly: outside basis = tax capital + share of liabilities."],
["pship","§752 liabilities","An increase in a partner's share of partnership debt counts as a cash contribution and raises basis. A decrease counts as a cash distribution and lowers it."],
["pship","Guaranteed payment","A payment to a partner for services or capital that doesn't depend on partnership income. Deductible by the partnership, ordinary income to the partner, reported on the K-1."],
["pship","Substantial economic effect (§704(b))","The test a special allocation must pass to be respected: it has to match the real economic deal, mainly through properly kept capital accounts."],
["pship","§704(c)","Built-in gain or loss on contributed property is allocated back to the partner who contributed it."],
["pship","§754 election","Lets the partnership adjust the inside basis of its assets when an interest is sold (§743(b)) or on certain distributions (§734(b)). It keeps inside and outside basis in line."],
["pship","Hot assets (§751)","Unrealized receivables and inventory. Gain on selling a partnership interest is ordinary income to the extent it comes from these."],
["pship","Separately stated items","Items that could affect partners differently are listed apart from ordinary income on Schedule K: capital gains, §179, charitable gifts, interest income, foreign taxes."],
["pship","Partnership representative","The single person with authority to deal with the IRS in a BBA audit. Their decisions bind the partnership and all partners. Replaced the old tax matters partner."],
["pship","AAR (administrative adjustment request)","How a partnership under the centralized audit regime corrects a filed return, instead of an amended Form 1065. It uses Form 8082."],
["pship","Distribution in excess of basis","Cash (including debt relief) distributed above a partner's outside basis is taxable gain. Basis never goes below zero."],
["pship","Self-employment income of partners","General partners pay SE tax on their share of ordinary business income and on guaranteed payments. Limited partners pay it only on guaranteed payments for services."],

["scorp","S corporation eligibility","Domestic corporation, at most 100 shareholders, only US citizens or residents, estates and certain trusts as owners, and a single class of stock."],
["scorp","Form 2553","The S election. Due by the 15th day of the third month of the tax year it applies to (March 15 for calendar years). All shareholders must consent."],
["scorp","Reasonable compensation","A shareholder who works in the business must be paid a market-rate W-2 salary before taking distributions. The IRS can reclassify distributions as wages."],
["scorp","Stock basis and debt basis","Losses are deductible up to stock basis, then basis in loans the shareholder made directly to the corporation. A guarantee of corporate bank debt adds no basis."],
["scorp","Form 7203","The shareholder's schedule of S corporation stock and debt basis. Attached to the 1040 when claiming a loss, receiving a distribution, selling stock or receiving a loan repayment."],
["scorp","AAA (accumulated adjustments account)","The corporate-level account of S-period income already taxed to shareholders. It decides whether a distribution is tax-free or a dividend when old C corporation E&P exists."],
["scorp","Built-in gains tax (§1374)","A corporate-level tax, at the 21 percent rate, on gain from assets held on conversion from C to S and sold within 5 years."],
["scorp","Per share, per day","The only way S corporation items are allocated. No special allocations are allowed; unequal distributions risk a second class of stock."],
["scorp","2% shareholder health insurance","Premiums paid for a more-than-2% shareholder are added to W-2 Box 1 wages, not subject to FICA, and deducted above the line on the shareholder's 1040."],
["scorp","S corporation basis ordering","Each year: increase for income, decrease for distributions, then for nondeductible expenses, then for losses and deductions."],
["scorp","Excess passive income","An S corporation with old C corporation E&P pays tax if passive investment income tops 25 percent of gross receipts. Three years in a row ends the S election."],

["ccorp","Schedule M-1","Reconciles net income per books to taxable income on Form 1120. Lists income and expenses treated differently for book and tax."],
["ccorp","Schedule M-3","The detailed book-tax reconciliation required instead of M-1 when total assets are $10 million or more."],
["ccorp","Schedule L and M-2","Schedule L is the beginning and ending balance sheet per books. Schedule M-2 rolls unappropriated retained earnings and must tie to L."],
["ccorp","Net operating loss (C corporation)","Losses arising after 2017 carry forward indefinitely, have no carryback, and offset at most 80 percent of taxable income in a year."],
["ccorp","Dividends received deduction","A corporation deducts 50, 65 or 100 percent of dividends from domestic corporations, depending on ownership (under 20%, 20% up to 80%, 80% or more)."],
["ccorp","Corporate charitable limit","Capped at 10 percent of taxable income, with a 5-year carryforward. From 2026 only contributions above 1 percent of taxable income count."],
["ccorp","§163(j) interest limit","Business interest expense is deductible up to 30 percent of adjusted taxable income plus business interest income. Disallowed interest carries forward. Small businesses under the gross receipts test are exempt."],
["ccorp","Earnings and profits (E&P)","The tax measure of a corporation's ability to pay dividends. Related to retained earnings but computed under tax rules."],
["ccorp","Order of a corporate distribution","Dividend to the extent of current then accumulated E&P, next a return of capital that reduces stock basis, then capital gain."],
["ccorp","§351 transfer","No gain or loss when property is transferred to a corporation for stock and the transferors control at least 80 percent right after."],
["ccorp","§382 limitation","After an ownership change of more than 50 percentage points within 3 years, the yearly use of pre-change NOLs is capped."],
["ccorp","Consolidated return","One Form 1120 for an affiliated group connected through at least 80 percent ownership of vote and value. Intercompany transactions are deferred or eliminated."],
["ccorp","Corporate estimated tax","Due on the 15th day of the 4th, 6th, 9th and 12th months of the tax year. Required when the expected tax is $500 or more."],
["ccorp","Accumulated earnings tax","A 20 percent penalty tax on earnings a C corporation retains beyond the reasonable needs of the business to avoid shareholder dividend tax."],

["depr","MACRS recovery periods","5 years: computers, cars, light trucks. 7 years: furniture and most equipment. 15 years: land improvements. 27.5 years: residential rental. 39 years: nonresidential buildings."],
["depr","Half-year convention","Personal property is treated as placed in service at the midpoint of the year, whatever the actual date."],
["depr","Mid-quarter convention","Required when more than 40 percent of the year's personal property is placed in service in the last three months."],
["depr","Section 179","An election to expense qualifying property, capped at $2,560,000 for 2026 and reduced when purchases pass $4,090,000. Limited to business taxable income, so it can't create a loss."],
["depr","Bonus depreciation","100 percent first-year write-off for qualified property acquired after January 19, 2025. Applies to new and used property, has no dollar cap and can create a loss."],
["depr","§1245 recapture","Gain on selling depreciable personal property is ordinary income up to the depreciation taken."],
["depr","Unrecaptured §1250 gain","Gain on real property attributable to straight-line depreciation, taxed to individuals at a maximum of 25 percent."],
["depr","§1231 gain or loss","Net gain on business property held more than one year is treated as long-term capital gain; a net loss is ordinary. Net losses of the prior 5 years are recaptured first."],
["depr","De minimis safe harbor","An annual election to expense items costing up to $2,500 each ($5,000 with audited financial statements) instead of capitalizing them."],
["depr","Qualified improvement property (QIP)","Interior improvements to a nonresidential building made after the building was placed in service. 15-year life and eligible for bonus. Excludes enlargements, elevators and structural framework."],
["depr","Form 3115 and §481(a)","Form 3115 requests a change in accounting method. The §481(a) adjustment is the cumulative catch-up; an increase to income is generally spread over four years."],
["depr","All-events test and economic performance","An accrual-method deduction is allowed when the liability is fixed, the amount can be determined with reasonable accuracy, and economic performance has occurred."],
["depr","UNICAP (§263A)","Requires certain direct and indirect costs to be capitalized into inventory or self-constructed assets. Small businesses under the gross receipts test are exempt."],
["depr","§197 intangibles","Goodwill, customer lists, trademarks and similar intangibles acquired with a business are amortized straight line over 15 years."],
["depr","BAR test for repairs","Capitalize a cost that is a betterment, adapts the property to a new use, or restores it. Otherwise it is a deductible repair."],

["prov","Permanent difference","A book-tax difference that never reverses, such as fines, half of meals or tax-exempt interest. It changes the effective tax rate and creates no deferred tax."],
["prov","Temporary difference","A difference between the book and tax basis of an asset or liability that will reverse in a future year. It creates a deferred tax asset or liability."],
["prov","Deferred tax asset (DTA)","A future tax benefit: deductions or carryforwards usable later. Examples: accrued bonuses, bad debt and warranty reserves, NOLs."],
["prov","Deferred tax liability (DTL)","Tax payable in the future on income already in the books. Classic case: tax depreciation faster than book."],
["prov","Valuation allowance","A reserve against a deferred tax asset when it is more likely than not that some or all of it won't be realized."],
["prov","Uncertain tax position (ASC 740-10)","Two steps. Recognize the benefit only if more likely than not to be sustained on technical merits. Then measure the largest amount more than 50 percent likely to be realized."],
["prov","Effective tax rate (ETR)","Total income tax expense divided by pre-tax book income."],
["prov","Rate reconciliation","The footnote schedule that explains the gap between the 21 percent statutory rate and the effective rate: state taxes, permanent items, credits, valuation allowance."],
["prov","Return-to-provision (RTP)","The true-up between the tax estimated in the year-end provision and the amounts on the return actually filed."],
["prov","Current vs deferred tax expense","Current is the tax on this year's return. Deferred is the change in deferred tax assets and liabilities during the year. Together they equal total tax expense."],
["prov","Enacted tax rate","Deferred taxes are measured at the rate enacted for the year the difference will reverse. A law change is recorded in the period it is enacted."],

["intl","Form 5472","Information return of a 25 percent foreign-owned US corporation, one per foreign related party with reportable transactions. Attached to Form 1120. Penalty $25,000 per form."],
["intl","Reportable transaction (Form 5472)","Any exchange of money or property with a foreign related party: sales, purchases, rents, royalties, service fees, interest, loans and capital contributions."],
["intl","Transfer pricing (§482)","Prices between related parties must be arm's length, meaning what unrelated parties would charge. Supported by intercompany agreements and a transfer pricing study."],
["intl","FDAP income","Fixed, determinable, annual or periodic US-source income of a foreign person: interest, dividends, rents, royalties. Taxed at 30 percent of the gross amount by withholding unless a treaty lowers it."],
["intl","Effectively connected income (ECI)","Income of a foreign person connected with a US trade or business. Taxed on a net basis at regular US rates."],
["intl","Form W-8BEN-E","Given by a foreign entity to the US payer to certify foreign status and claim treaty benefits. Individuals use Form W-8BEN."],
["intl","Forms 1042 and 1042-S","The withholding agent's annual return and recipient statements for US-source payments to foreign persons. Due March 15."],
["intl","Permanent establishment","A fixed place of business, or a dependent agent, in a treaty country. Under most treaties business profits are taxable there only if a permanent establishment exists."],
["intl","Controlled foreign corporation (CFC)","A foreign corporation more than 50 percent owned by US shareholders, each holding at least 10 percent."],
["intl","Subpart F and NCTI","Rules that tax US shareholders currently on certain CFC income. NCTI (net CFC tested income) is the new name for GILTI for years beginning after 2025."],
["intl","Form 5471","Information return filed by certain US persons who are officers, directors or shareholders of foreign corporations. The outbound counterpart of Form 5472."],
["intl","FBAR (FinCEN Form 114)","Filed by US persons whose foreign financial accounts total more than $10,000 at any time in the year. Filed with FinCEN, not the IRS. Due April 15 with an automatic extension to October 15."],
["intl","Form 8938","Statement of specified foreign financial assets attached to the tax return. Higher thresholds than the FBAR, starting at $50,000 for single filers living in the US."],
["intl","Substantial presence test","A person is a US resident with at least 31 days this year and 183 weighted days: all of this year, one third of last year, one sixth of the year before."],
["intl","BEAT","The base erosion and anti-abuse tax, a minimum tax on very large corporations (average gross receipts of $500 million or more) that make deductible payments to foreign related parties."],
["intl","Branch profits tax","A 30 percent tax (or lower treaty rate) on a foreign corporation's US branch earnings that are treated as sent home. It mirrors the dividend withholding a subsidiary would face."],

["pay","FICA","Social Security at 6.2 percent up to the wage base ($184,500 for 2026) plus Medicare at 1.45 percent on all wages. Withheld from the employee and matched by the employer."],
["pay","Additional Medicare tax","An extra 0.9 percent on wages above $200,000, for the employee only. The employer withholds it but doesn't match it."],
["pay","FUTA","Federal unemployment tax paid only by the employer: 6.0 percent on the first $7,000 of each employee's wages, usually 0.6 percent after the state credit. Reported on Form 940."],
["pay","Form 941","The employer's quarterly return for withheld income tax and both shares of Social Security and Medicare. Due the last day of the month after each quarter."],
["pay","Deposit schedules","Monthly or semiweekly, based on taxes reported in a lookback period (over $50,000 means semiweekly). $100,000 of liability on any day is due the next business day."],
["pay","Trust fund recovery penalty (§6672)","Personal liability equal to 100 percent of unpaid withheld income tax and employee FICA, for any responsible person who willfully fails to pay it over."],
["pay","Employee vs independent contractor","Decided by behavioral control, financial control and the type of relationship. Employees get a W-2 with withholding; contractors get a 1099-NEC."],
["pay","Form 1099-NEC","Reports nonemployee compensation. Threshold is $2,000 for payments made in 2026 (it was $600). Due to the contractor and the IRS by January 31."],
["pay","Backup withholding","A payer must withhold 24 percent from reportable payments when the payee doesn't provide a correct TIN on Form W-9."],
["pay","Self-employment tax","15.3 percent on 92.35 percent of net self-employment earnings. The Social Security part stops at the wage base. Half of the tax is deductible above the line."],
["pay","Accountable plan","An employer reimbursement arrangement with a business connection, substantiation and return of excess amounts. Reimbursements under it are not wages."],

["proc","Statute of limitations on assessment","Three years from the later of the due date or filing date. Six years if more than 25 percent of gross income is omitted. No limit for fraud or no return."],
["proc","Refund claim deadline","The later of 3 years from when the return was filed or 2 years from when the tax was paid."],
["proc","Failure-to-file penalty","5 percent of unpaid tax per month, up to 25 percent. Reduced by the failure-to-pay penalty for months when both apply."],
["proc","Failure-to-pay penalty","0.5 percent of unpaid tax per month, up to 25 percent."],
["proc","Accuracy-related penalty (§6662)","20 percent of the underpayment caused by negligence or a substantial understatement of tax."],
["proc","First-time abatement","Administrative waiver of failure-to-file, failure-to-pay or failure-to-deposit penalties for a taxpayer with a clean record for the prior 3 years."],
["proc","CP2000","A notice proposing changes because third-party forms (W-2, 1099) don't match the return. It is not an audit and not a bill. Respond by the deadline."],
["proc","Notice of deficiency (90-day letter)","The formal notice that lets the IRS assess tax. The taxpayer has 90 days to petition the Tax Court without paying first."],
["proc","Form 2848 vs Form 8821","Form 2848 is a power of attorney: you can represent and negotiate. Form 8821 only authorizes you to receive the client's tax information."],
["proc","Circular 230","Treasury rules for those who practice before the IRS: due diligence, competence, conflicts of interest, fees, and standards for positions and written advice."],
["proc","§6694 preparer penalty","Applies when a preparer takes an unreasonable position. An undisclosed position needs substantial authority; a disclosed one needs a reasonable basis."],
["proc","Form 8275","Disclosure statement attached to a return to flag a position. Used to avoid accuracy and preparer penalties when there is a reasonable basis."],
["proc","§7216","Makes it a crime for a preparer to use or disclose tax return information for other purposes without the taxpayer's written consent."],
["proc","Extension","Form 4868 (individuals) or Form 7004 (businesses) gives more time to file, not to pay. Interest and the failure-to-pay penalty still run on unpaid tax."],
["proc","Form 8879","The e-file signature authorization. The client must sign it before the preparer transmits the return."],

["state","Nexus","The minimum connection with a state that allows it to impose a tax. Created by physical presence or by economic activity above a threshold."],
["state","Economic nexus (Wayfair)","Since South Dakota v. Wayfair (2018), states can require out-of-state sellers to collect sales tax once sales into the state pass a threshold, commonly $100,000."],
["state","P.L. 86-272","Federal law that bars a state from taxing net income when a company's only in-state activity is soliciting orders for tangible goods that are approved and shipped from outside the state."],
["state","Apportionment","The formula that divides a multistate business's income among states. Most states now use a single sales factor."],
["state","Allocation","Assigning nonbusiness income, such as gain on an investment property, entirely to one state instead of apportioning it."],
["state","Market-based sourcing","Service revenue is sourced to the state where the customer receives the benefit. The older rule, cost of performance, sources it to where the work is done."],
["state","Throwback rule","Sales shipped to a state where the seller isn't taxable are added back to the sales factor of the state they were shipped from."],
["state","PTET (pass-through entity tax)","An elective state tax paid by a partnership or S corporation. Deductible federally at the entity level, outside the owners' SALT cap. Owners get a state credit."],
["state","Decoupling","When a state doesn't follow a federal rule, such as bonus depreciation. It requires state addbacks and a separate state depreciation schedule."],
["state","Domicile vs statutory residency","Domicile is your true permanent home. A statutory resident keeps a permanent place of abode in the state and spends more than 183 days there. Either one makes you a resident."],
["state","Composite return and nonresident withholding","Ways a pass-through entity pays state tax on behalf of owners who live in other states."],
["state","Use tax","The counterpart of sales tax, owed by the buyer when the seller didn't collect sales tax on a taxable purchase."],
["state","NYC unincorporated business tax","New York City's 4 percent tax on partnerships and sole proprietors carrying on a business in the City."],

["law","2026 standard deduction","$16,100 single or married filing separately, $32,200 married filing jointly, $24,150 head of household."],
["law","2026 top bracket","37 percent on taxable income above $640,600 single and $768,700 married filing jointly."],
["law","Senior deduction","$6,000 per person age 65 or older for 2025 through 2028, on top of the standard deduction. Phases out above MAGI of $75,000 ($150,000 joint)."],
["law","SALT cap for 2026","$40,400 ($20,200 married filing separately). Shrinks for income above about $505,000, never below $10,000. Returns to $10,000 in 2030."],
["law","Tips and overtime deductions","For 2025 through 2028: up to $25,000 of qualified tips and up to $12,500 ($25,000 joint) of the premium part of overtime pay."],
["law","Car loan interest deduction","Up to $10,000 a year of interest on a loan for a new vehicle with final assembly in the US, for 2025 through 2028."],
["law","Child tax credit 2026","$2,200 per qualifying child under 17. The child needs a Social Security number."],
["law","1099-NEC and 1099-MISC threshold","$2,000 for payments made after December 31, 2025. It was $600."],
["law","2026 retirement limits","401(k) deferral $24,500. IRA $7,500. HSA $4,400 self-only and $8,750 family."],
["law","2026 mileage rates","Business: 72.5 cents per mile January to June, 76 cents July to December. Charity: 14 cents."],
["law","Estate and gift 2026","Basic exclusion $15 million per person. Annual gift exclusion $19,000 per recipient."],
["law","QBI deduction after OBBBA","The 20 percent deduction is permanent. The 2026 limits start to phase in above taxable income of $201,750 ($403,500 joint)."],
["law","Excess business loss 2026","Business losses above $256,000 ($512,000 joint) are disallowed for the year and become an NOL carryforward."],
["law","Gross receipts test 2026","$32 million average annual gross receipts over the prior 3 years. Passing it opens the cash method and exempts the business from §163(j) and UNICAP."],
["law","2026 long-term capital gain brackets","0 percent up to $49,450 single ($98,900 joint). 20 percent above $545,500 single ($613,700 joint). 15 percent in between."],
["law","Research costs (§174A)","Domestic research and experimental costs are immediately deductible again for years beginning after 2024. Foreign research is still amortized over 15 years."]
];

/* Tax Sprint content, part 2: questions. In every MCQ the FIRST option is the correct one; the app shuffles them. Append new items at the end. */
const MCQ=[
{a:"ind",q:"A taxpayer has a K-1 loss from an LLC. In what order do the loss limitations apply?",o:["Basis, at-risk, passive activity, excess business loss","At-risk, basis, passive activity, excess business loss","Passive activity, basis, at-risk, excess business loss","Excess business loss, passive activity, at-risk, basis"],e:"Each gate is tested in that order. A loss blocked at one gate carries forward under that gate's own rule."},
{a:"ind",q:"Which credit can produce a refund even when the tax is zero?",o:["Earned income tax credit","Credit for other dependents","Lifetime learning credit","Foreign tax credit"],e:"The EITC is refundable. The other three only reduce tax to zero."},
{a:"ind",q:"Sara sells stock at a $4,000 loss on December 10 and buys the same stock back on December 28. What happens to the loss?",o:["It is disallowed and added to the basis of the new shares","It is allowed in full because it was realized","It is lost permanently","It becomes a long-term loss carried to next year"],e:"A repurchase within 30 days is a wash sale. The loss is deferred by adding it to the new shares' basis."},
{a:"ind",q:"A married couple sells their main home for a $620,000 gain after owning and living in it for 10 years. How much gain is taxable?",o:["$120,000","$0","$370,000","$620,000"],e:"§121 excludes up to $500,000 on a joint return. $620,000 minus $500,000 leaves $120,000."},
{a:"ind",q:"A single taxpayer has a $12,000 net capital loss and no gains. How much offsets ordinary income this year?",o:["$3,000, and the rest carries forward","$12,000","$0, capital losses only offset capital gains","$6,000, and the rest is lost"],e:"The annual limit is $3,000 ($1,500 married filing separately). The unused $9,000 carries forward indefinitely."},
{a:"ind",q:"Last year's tax was $30,000 and AGI was $200,000. What is the prior-year safe harbor for this year's estimated payments?",o:["$33,000","$30,000","$27,000","$36,000"],e:"With prior-year AGI above $150,000 the safe harbor is 110 percent of last year's tax: $30,000 × 110% = $33,000."},
{a:"ind",q:"Who most likely qualifies for head of household?",o:["An unmarried parent who pays most of the household costs and whose child lived with them all year","A married person who lives with their spouse and files separately","A single person living alone with no dependents","An unmarried person who supports a friend living in another city"],e:"Head of household needs an unmarried taxpayer, more than half the cost of the home, and a qualifying person living there."},
{a:"ind",q:"Form 4868 gives an individual more time to do what?",o:["File the return, but not pay the tax","Pay the tax, but not file the return","Both file and pay","Make prior-year IRA contributions until October 15"],e:"An extension is for filing only. Tax is still due on the original due date, and interest and the failure-to-pay penalty run from then."},
{a:"ind",q:"A taxpayer actively participates in a rental with a $20,000 loss. MAGI is $90,000. How much can be deducted against wages?",o:["The full $20,000","Nothing, rental losses are always suspended","$10,000","$3,000"],e:"The $25,000 special allowance applies in full because MAGI is below $100,000."},
{a:"ind",q:"An heir sells inherited stock for $52,000. The decedent paid $10,000; the value at death was $50,000. What is the gain?",o:["$2,000, long term","$42,000, long term","$2,000, short term if sold within a year","$52,000, ordinary"],e:"Inherited property takes a basis of fair market value at death and is always treated as long term."},

{a:"pship",q:"Beginning outside basis $40,000. Share of ordinary income $25,000, tax-exempt interest $1,000, share of partnership debt up $10,000, cash distribution $30,000. Ending outside basis?",o:["$46,000","$36,000","$45,000","$76,000"],e:"40,000 + 25,000 + 1,000 + 10,000 − 30,000 = 46,000. Tax-exempt income and a larger share of debt both raise basis."},
{a:"pship",q:"How is a guaranteed payment to a partner for services treated?",o:["Deductible by the partnership; ordinary income to the partner, generally subject to SE tax","A distribution that reduces basis and is not taxable","W-2 wages with income tax withholding","Capital gain to the partner"],e:"Guaranteed payments are reported on the K-1, deducted by the partnership and taxed as ordinary income. Partners are not employees."},
{a:"pship",q:"A partner is allocated a $60,000 loss. Outside basis before the loss is $45,000. Assuming the at-risk and passive rules are met, how much is deductible this year?",o:["$45,000; the other $15,000 is suspended until basis is restored","$60,000","$0","$45,000; the other $15,000 is lost for good"],e:"Losses are limited to outside basis. The excess carries forward until the partner has basis again."},
{a:"pship",q:"A partner with outside basis of $35,000 receives a $50,000 cash distribution. What is the result?",o:["$15,000 gain and basis drops to zero","$50,000 of ordinary income","No gain and a negative basis of $15,000","A $15,000 loss"],e:"Cash above outside basis is gain. Basis can't go below zero."},
{a:"pship",q:"What does a §754 election do when someone buys a partnership interest?",o:["Lets the partnership adjust the inside basis of its assets for the buyer under §743(b)","Lets the partnership elect out of the centralized audit regime","Turns guaranteed payments into capital gain","Allows special allocations without economic effect"],e:"The buyer's share of inside basis is stepped up (or down) to match what they paid, which lines up inside and outside basis."},
{a:"pship",q:"Under the centralized audit regime (BBA), who has sole authority to act for the partnership with the IRS?",o:["The partnership representative","The tax matters partner","Any general partner","The partner with the largest capital account"],e:"The partnership representative binds the partnership and every partner. The tax matters partner belonged to the old TEFRA rules."},
{a:"pship",q:"Why can a partner's tax basis capital account be negative while outside basis is still positive?",o:["Outside basis includes the partner's share of partnership liabilities; the capital account doesn't","Capital accounts are reported at fair market value","Outside basis includes guaranteed payments received","Capital accounts are reduced by the QBI deduction"],e:"Debt-financed losses and distributions can push capital below zero while the share of liabilities keeps basis positive."},
{a:"pship",q:"A partner contributed land with built-in gain. The partnership later sells it. Who is taxed on the pre-contribution gain?",o:["The contributing partner, under §704(c)","All partners, by profit share","The partnership, at 21 percent","Nobody; the contribution erased the gain"],e:"§704(c) sends built-in gain or loss back to the partner who contributed the property."},
{a:"pship",q:"Selling a partnership interest generally produces capital gain, except to the extent of what?",o:["Hot assets under §751: unrealized receivables and inventory","Guaranteed payments received during the year","The partner's share of liabilities","§1231 assets held more than one year"],e:"The part of the gain that comes from hot assets is ordinary income."},
{a:"pship",q:"When is a calendar-year Form 1065 due, and to when can it be extended?",o:["March 15, extended to September 15","April 15, extended to October 15","March 15, extended to October 15","April 15, extended to September 15"],e:"Partnership and S corporation returns are due the 15th day of the third month, with a six-month extension."},

{a:"scorp",q:"Which event would make a corporation ineligible to be an S corporation?",o:["Issuing stock to a nonresident alien individual","Having 80 shareholders","Having voting and nonvoting common stock","Having an estate as a shareholder"],e:"Nonresident aliens can't be shareholders. The limit is 100 shareholders, estates are allowed, and voting differences don't create a second class of stock."},
{a:"scorp",q:"A shareholder has stock basis of $10,000, made no direct loans, and personally guaranteed a $200,000 bank loan to the S corporation. Their share of the loss is $50,000. How much is deductible?",o:["$10,000","$50,000","$0","$210,000 of losses would be allowed"],e:"A guarantee doesn't create debt basis. Only stock basis and direct shareholder loans count."},
{a:"scorp",q:"A sole shareholder works full time in the S corporation, takes $150,000 of distributions and no salary. What is the main risk?",o:["The IRS reclassifies distributions as wages, with payroll taxes, penalties and interest","The built-in gains tax applies to the distributions","The S election terminates automatically","The corporation owes the accumulated earnings tax"],e:"Shareholder-employees must receive reasonable compensation before distributions."},
{a:"scorp",q:"How are health insurance premiums paid for a more-than-2% shareholder-employee treated?",o:["Included in W-2 Box 1 wages, not subject to FICA, and deductible above the line by the shareholder","Excluded from wages, as for any other employee","Nondeductible to the corporation and ignored by the shareholder","Subject to FICA and reported only in Boxes 3 and 5"],e:"They are wages for income tax but not for FICA, and the shareholder takes the self-employed health insurance deduction."},
{a:"scorp",q:"How are S corporation items allocated among shareholders?",o:["Pro rata, per share per day","By special allocations in the shareholder agreement","By capital contributed","By hours worked in the business"],e:"There are no special allocations in an S corporation."},
{a:"scorp",q:"Which form does a shareholder use to report S corporation stock and debt basis?",o:["Form 7203","Form 2553","Form 8082","Form 4562"],e:"Form 7203 is attached to the 1040. Form 2553 is the S election; 8082 is for inconsistent treatment and AARs; 4562 is depreciation."},
{a:"scorp",q:"When does the built-in gains tax apply?",o:["A former C corporation sells assets it held at conversion within 5 years of becoming an S corporation","Any S corporation sells a capital asset","A shareholder sells stock within 5 years","Passive income exceeds 25 percent of gross receipts"],e:"§1374 taxes, at the corporate level, the appreciation that existed on the conversion date if recognized within 5 years."},
{a:"scorp",q:"A calendar-year corporation wants S status effective January 1, 2027. What is the last day to file Form 2553 on time?",o:["March 15, 2027","January 1, 2027","April 15, 2027","The due date of the first Form 1120-S"],e:"The election is due by the 15th day of the third month of the year it takes effect."},
{a:"scorp",q:"An S corporation with no C corporation E&P distributes $40,000 to a shareholder whose stock basis is $25,000. What is the result?",o:["$25,000 tax-free return of basis and $15,000 capital gain","A $40,000 dividend","$40,000 tax free, with a negative basis","$15,000 of ordinary income"],e:"Distributions reduce stock basis first. The excess over basis is capital gain."},

{a:"ccorp",q:"Book income is $400,000 after deducting federal income tax expense of $90,000, meals of $30,000 and fines of $5,000. Tax depreciation exceeds book by $40,000. What is taxable income?",o:["$470,000","$455,000","$510,000","$485,000"],e:"400,000 + 90,000 federal tax + 15,000 (half of meals) + 5,000 fines − 40,000 extra depreciation = 470,000."},
{a:"ccorp",q:"A C corporation has taxable income of $500,000 before a $700,000 NOL carryforward from 2022. How much NOL can it deduct?",o:["$400,000","$500,000","$700,000","$350,000"],e:"Post-2017 NOLs can offset only 80 percent of taxable income: $500,000 × 80% = $400,000. The remaining $300,000 carries forward."},
{a:"ccorp",q:"Which of these is a permanent book-tax difference?",o:["Fines paid to a government agency","Bonus depreciation","A bad debt reserve","Accrued vacation pay"],e:"Fines are never deductible. The other three reverse over time, so they are temporary."},
{a:"ccorp",q:"A corporation owns 30 percent of another domestic corporation and receives a $100,000 dividend. What is the dividends received deduction, ignoring income limits?",o:["$65,000","$50,000","$100,000","$80,000"],e:"Ownership of 20 percent up to 80 percent gives a 65 percent deduction."},
{a:"ccorp",q:"When must a corporation file Schedule M-3 instead of Schedule M-1?",o:["When total assets are $10 million or more","When gross receipts exceed $32 million","When it has more than 100 shareholders","When any shareholder is foreign"],e:"The M-3 threshold is based on total assets at year end."},
{a:"ccorp",q:"A corporation with no current or accumulated E&P distributes cash to a shareholder. How is it treated?",o:["Return of capital that reduces stock basis, then capital gain","A taxable dividend","Ordinary income to the shareholder","A deductible expense of the corporation"],e:"Without E&P there is no dividend. The distribution first recovers basis; any excess is capital gain."},
{a:"ccorp",q:"When is a calendar-year Form 1120 due, and to when can it be extended?",o:["April 15, extended to October 15","March 15, extended to September 15","April 15, extended to September 15","March 15, extended to October 15"],e:"C corporation returns are due the 15th day of the fourth month, with a six-month extension."},
{a:"ccorp",q:"What is the general limit on deducting business interest under §163(j)?",o:["30 percent of adjusted taxable income, plus business interest income","50 percent of taxable income","10 percent of taxable income","There is no limit for corporations"],e:"Disallowed interest carries forward. Businesses under the gross receipts test are exempt."},
{a:"ccorp",q:"For a transfer of property to a corporation in exchange for stock to be tax free under §351, the transferors must do what?",o:["Control at least 80 percent of the corporation immediately after","Own more than 50 percent immediately after","Own 100 percent immediately after","Hold the stock for at least 5 years"],e:"Control means at least 80 percent of the voting power and of each other class of stock."},
{a:"ccorp",q:"Starting in 2026, how are a C corporation's charitable contributions limited?",o:["Deductible only above 1 percent of taxable income, up to 10 percent","Fully deductible with no limit","Deductible up to 25 percent of taxable income","Not deductible at all"],e:"The 2025 law added a 1 percent floor under the existing 10 percent ceiling."},

{a:"depr",q:"More than 40 percent of this year's equipment was placed in service in the fourth quarter. Which convention applies?",o:["Mid-quarter","Half-year","Mid-month","Full-year"],e:"The mid-quarter convention replaces half-year when over 40 percent of personal property goes into service in the last three months."},
{a:"depr",q:"What is a key difference between §179 and bonus depreciation?",o:["§179 is limited to business taxable income, so it can't create a loss; bonus can","Bonus applies only to brand new property","§179 has no dollar cap","Bonus must be elected asset by asset"],e:"§179 also has a dollar cap and an investment phaseout. Bonus covers used property and applies by default to a whole class."},
{a:"depr",q:"Equipment cost $100,000, depreciation taken is $60,000, and it sells for $90,000. What is the character of the $50,000 gain?",o:["All ordinary income under §1245","All §1231 gain","$40,000 ordinary and $10,000 §1231 gain","All long-term capital gain"],e:"§1245 recapture is the lesser of the gain ($50,000) or depreciation taken ($60,000), so the whole gain is ordinary."},
{a:"depr",q:"What is the recovery period for a nonresidential building?",o:["39 years","27.5 years","15 years","7 years"],e:"Nonresidential real property is 39 years, straight line, mid-month convention. Residential rental is 27.5 years."},
